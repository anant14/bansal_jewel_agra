# The database is on Neon (free, no expiry): set DATABASE_URL (pooled) and
# DATABASE_URL_UNPOOLED (direct) from the Neon dashboard / `neon env pull`.
services:
  - type: web
    name: bansal-jewellers
    env: node
    plan: free
    # Migrations and the seed run at startup (src/db/bootstrap.js), so a
    # database outage can't fail the build.
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_APP_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_NOTIFY_TO
        sync: false
      - key: WHATSAPP_RATE_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_RATE_TEMPLATE_LANG
        sync: false
